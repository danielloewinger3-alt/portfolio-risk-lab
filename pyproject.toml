[project]
name = "portfolio-risk-lab"
version = "0.1.0"
description = "Portfolio risk analytics: classical quant risk, honestly evaluated ML, and grounded GenAI over SEC filings."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3.0",
    "arch>=8.0.0",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastembed>=0.9.1",
    "hmmlearn>=0.3.3",
    "lightgbm>=4.7.0",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.1",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.13",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "responses>=0.26.3",
    "ruff>=0.17.3",
    "types-requests>=2.33.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/risklab"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "app", "scripts"]
extend-exclude = [".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode in strings (Greek letters in finance docstrings are intended)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
# _bootstrap sorts first so it runs before any risklab import in app pages.
known-first-party = ["risklab", "_bootstrap", "components"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"app/**" = ["E402"] # pages import after _bootstrap adjusts sys.path

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src"]
exclude = ['^\.worktrees/']
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".worktrees", ".git", ".venv", "node_modules", ".hypothesis"]
addopts = "--strict-markers -ra"
markers = [
    "network: test hits the live network (skipped by default; run with -m network)",
    "slow: slow test (still runs by default)",
]
filterwarnings = [
    "ignore::DeprecationWarning:yfinance.*",
]

[tool.coverage.run]
source = ["src/risklab"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.uv]
# Use uv-managed CPython only: an active conda env (e.g. x86_64 anaconda on Apple Silicon)
# would otherwise win, and onnxruntime (fastembed) ships no macOS x86_64 wheel.
python-preference = "only-managed"
